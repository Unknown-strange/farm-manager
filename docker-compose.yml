services:
  db:
    image: postgres:16-alpine
    container_name: eggbook_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: eggbook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d eggbook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

